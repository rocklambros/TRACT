name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lint toolchain
        run: pip install -r requirements-lint.txt

      - name: Ruff check
        run: >
          ruff check tract/ parsers/ scripts/phase1a/ scripts/phase1b/
          scripts/phase0/runpod_provision.py scripts/phase1c/runpod_retrain.py

      # Everything the LOFO run executes. parsers/ was linted by ruff but never
      # type-checked, and scripts/phase1b/ was covered by neither -- which is
      # how ablation.py kept passing a TrainingConfig kwarg that no longer
      # existed. scripts/phase0/exp*.py is finished Phase 0 experiment code and
      # stays out of scope on purpose.
      - name: Mypy strict (run path)
        run: >
          mypy tract/ parsers/ scripts/phase1a/ scripts/phase1b/
          scripts/phase0/runpod_provision.py
          scripts/phase1c/runpod_retrain.py --strict

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # pyproject defines the integration marker as "requiring real deployment
      # model and artifacts (deselect with '-m not integration')", and those
      # artifacts are not in the repo. The model-pins job below runs the one
      # integration test that can stand alone. This job never deselected them,
      # which nobody noticed while lint kept the job from starting.
      - name: Run tests
        run: pytest tests/ -x -q --timeout=60 -m "not integration"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # pip-audit comes from requirements.txt (pinned). The bare
      # `pip install pip-audit` that used to sit here silently upgraded it
      # past that pin on every run.
      # -r audits a requirements file by resolving it, without installing it,
      # so the pinned ML stack gets scanned without pulling torch into CI. It
      # also fails if requirements-ml.txt stops resolving, which keeps the pin
      # from rotting silently.
      #
      # The four --ignore-vuln ids are not a blanket suppression. Each is one
      # transformers advisory whose fix landed in the 5.x line, which requires
      # huggingface-hub >= 1.3.0 against tract's own `huggingface_hub>=0.24,<1`
      # core dependency, and which sentence-transformers 3.2.0 independently
      # caps out of reach. The argument for each, the package, and the date the
      # argument expires live in tract/supply_chain.py:AUDIT_SUPPRESSIONS, and
      # tests/test_supply_chain.py fails when this list and that registry
      # disagree or when an entry passes its expiry.
      - name: Audit dependencies
        run: |
          pip-audit --desc
          pip-audit --desc -r requirements-ml.txt \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290
  model-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.11" }
      # 0.36.2 is the last pre-1.0 release, which is what the previous
      # ">=0.24,<1" range resolved to. A range is not a pin.
      - run: pip install pytest==9.0.3 huggingface_hub==0.36.2 -e .
      - run: python -m pytest tests/test_model_pins_consistency.py -m integration -q

  # The `test` job installs requirements.txt, which carries none of the ML
  # stack, so every training test skips there. That left the LoRA save/reload
  # regression -- the one guarding a defect that silently shipped a checkpoint
  # scoring at chance -- as documentation rather than enforcement. This job
  # installs the pinned training stack and runs those tests for real. The
  # regression tests use all-MiniLM-L6-v2 (~90MB), not BGE-large.
  training-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # 3.12 because that is what the pods run, not because it is newer. This
      # job's whole claim is "the pinned training stack installs and imports
      # where the folds run it", and the folds run it on the Debian 3.12 inside
      # the digest-pinned ubuntu2404 image. At 3.11 the job was proving that
      # claim about an interpreter no pod has, so both its PASS and its FAIL
      # said nothing about the fleet. Held equal to
      # scripts/phase1b/runpod_parallel.py:POD_PYTHON_VERSION by
      # tests/test_supply_chain.py.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install the pinned training stack
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-train.txt
          pip install -e . pytest pytest-timeout
      - name: Assert the pins actually resolved
        run: |
          python - <<'PY'
          import torch, transformers, sentence_transformers, peft, tokenizers
          expected = {
              "torch": ("2.13.0", torch.__version__.split("+")[0]),
              "transformers": ("4.57.6", transformers.__version__),
              "sentence-transformers": ("5.7.0", sentence_transformers.__version__),
              "peft": ("0.20.0", peft.__version__),
              "tokenizers": ("0.22.2", tokenizers.__version__),
          }
          bad = {k: v for k, (want, got) in expected.items() if (v := got) != want}
          if bad:
              raise SystemExit(f"pins did not resolve: {bad}")
          print("pinned stack verified:", {k: g for k, (_, g) in expected.items()})
          PY
      # Runs BEFORE the regression tests on purpose. sentence-transformers 5.4
      # reorganised the package, so a pin bump can break every training import
      # while the regression tests below only surface it indirectly, deep in a
      # model-loading test that downloads a checkpoint first. This step imports
      # every module the pods import and costs seconds. scripts/phase1b/alpha.py
      # is included because no test imports it, so it is invisible to the suite.
      - name: Prove the training modules import under the pinned stack
        env:
          USE_TF: "0"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python - <<'PY'
          import importlib
          from tract.training.st_compat import (
              SYMBOL_PATHS, installed_version, is_tested_version,
              resolve_symbol_source,
          )
          version = installed_version()
          if not is_tested_version(version):
              raise SystemExit(
                  f"sentence-transformers=={version} is outside the tested set; "
                  f"add its layout to tract/training/st_compat.py first."
              )
          for module in (
              "tract.training.data",
              "tract.training.loop",
              "scripts.phase1b.alpha",
          ):
              importlib.import_module(module)
          sources = {s: resolve_symbol_source(s) for s in sorted(SYMBOL_PATHS)}
          print(f"sentence-transformers=={version} resolves:")
          for symbol, source in sources.items():
              print(f"  {symbol} <- {source}")
          PY

      - name: Run the training regression tests
        env:
          USE_TF: "0"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python -m pytest tests/test_st_compat.py tests/test_training_loop.py \
            tests/test_firewall.py \
            tests/test_fold_aggregation.py tests/test_gate_decision.py \
            tests/test_runpod_safety.py tests/test_publish_merge.py \
            -q --timeout=900 -m "not integration"
