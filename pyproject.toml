[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tract"
version = "0.1.0"
description = "Translating Requirements Across CRE Trees"
requires-python = ">=3.11"
# TRACT's own code only. The wheel ships `tract*` and nothing else, so no
# third-party framework text reaches it and CC0-1.0 is the whole truth here.
# The dataset and the model weights are a different question with a different
# answer, recorded in NOTICE and declared as `other` by both published cards.
#
# PEP 639 SPDX expression, which needs setuptools >= 77. The build requirement
# above pins >= 82.0.1, so this cannot silently degrade to a classifier.
license = "CC0-1.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=5.0",
    "defusedxml>=0.7.1",
    # Pinned with == rather than a floor. CI installs `-e .`, so a floor
    # resolves to whatever is newest on the day while requirements.txt pins
    # 3.1.5, and the two files would then state different things. parse_csa_ccm
    # reads the CCM workbook through it; reading the sheet XML directly would
    # mean reimplementing shared strings for one parser. defusedxml above flips
    # openpyxl's own DEFUSEDXML flag to True, so the workbook parses hardened.
    "openpyxl==3.1.5",
    "requests>=2.31",
    "huggingface_hub>=0.24,<1",
    # tract/supply_chain.py evaluates Requires-Python specifiers with it. It
    # already arrived transitively through huggingface_hub; declared here
    # because the code imports it directly and a transitive is not a contract.
    "packaging>=24.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.99.0",
    "pdfplumber>=0.10.0",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "types-PyYAML",
    "types-beautifulsoup4",
    "types-requests",
]
phase0 = [
    "torch>=2.2,<3",
    "transformers>=5.16.1,<6",
    "sentence-transformers>=3.0,<6",
    "anthropic>=0.99.0,<1",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    # Widened from <4 to admit the 5.0.1 pin in requirements-train.txt, which
    # closes the PYSEC-2026-3716 path traversal. The pods install this extra
    # and then that file, so a cap below the pin makes the two installs fight.
    "datasets>=2.18,<6",
    "einops>=0.7,<1",
    # Imported by tract/training/loop.py and scripts/phase1b/alpha.py. Absent
    # from this list until now, so the extra never installed a working
    # training environment.
    "peft>=0.10,<1",
]

[project.scripts]
tract = "tract.cli:main"

[tool.setuptools.packages.find]
include = ["tract*"]

[tool.mypy]
strict = true
python_version = "3.11"

# The heavy ML stack is deliberately absent from the lint job's environment
# (requirements-lint.txt), so mypy cannot see these modules. They ship no
# stubs worth installing a multi-hundred-megabyte torch wheel for on every
# CI run. numpy and huggingface_hub are NOT listed here: both ship py.typed
# and are installed, so they get real checking.
[[tool.mypy.overrides]]
module = [
    "datasets.*",
    "hdbscan.*",
    # pdfplumber ships no stubs and pulls pdfminer.six behind it.
    # parse_nist_ai_100_2.py and parse_nist_ssdf.py import it, both to read a
    # pinned PDF, and tests/synthetic_pdf.py writes one for them to read back.
    "pdfplumber.*",
    "peft.*",
    "scipy.*",
    "sentence_transformers.*",
    "torch.*",
    "transformers.*",
    "wandb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-k not slow')",
    "integration: marks tests requiring real deployment model and artifacts (deselect with '-m not integration')",
]
