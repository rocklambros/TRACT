[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tract"
version = "0.1.0"
description = "Translating Requirements Across CRE Trees"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=5.0",
    "requests>=2.31",
    "huggingface_hub>=0.24,<1",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.99.0",
    "pdfplumber>=0.10.0",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "types-PyYAML",
    "types-beautifulsoup4",
    "types-requests",
]
phase0 = [
    "torch>=2.2,<3",
    "transformers>=4.40,<5",
    "sentence-transformers>=3.0,<6",
    "anthropic>=0.99.0,<1",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "datasets>=5.0.1,<6",
    "einops>=0.7,<1",
]

[project.scripts]
tract = "tract.cli:main"

[tool.setuptools.packages.find]
include = ["tract*"]

[tool.mypy]
strict = true
python_version = "3.11"

# The heavy ML stack is deliberately absent from the lint job's environment
# (requirements-lint.txt), so mypy cannot see these modules. They ship no
# stubs worth installing a multi-hundred-megabyte torch wheel for on every
# CI run. numpy and huggingface_hub are NOT listed here: both ship py.typed
# and are installed, so they get real checking.
[[tool.mypy.overrides]]
module = [
    "datasets.*",
    "hdbscan.*",
    "peft.*",
    "scipy.*",
    "sentence_transformers.*",
    "torch.*",
    "transformers.*",
    "wandb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-k not slow')",
    "integration: marks tests requiring real deployment model and artifacts (deselect with '-m not integration')",
]
